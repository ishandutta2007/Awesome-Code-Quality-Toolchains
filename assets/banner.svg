<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Vibrant Gradient Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Dynamic pulsing and flow animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-18px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes scanLineFlow {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes badgeFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes badgeFloatLag {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    .orb-glow {
      animation: pulseGlow 6s ease-in-out infinite alternate;
      transform-origin: center;
    }
    .floating-dot-1 {
      animation: floatParticle 5s ease-in-out infinite;
    }
    .floating-dot-2 {
      animation: floatParticle 7s ease-in-out infinite 1.5s;
    }
    .floating-dot-3 {
      animation: floatParticle 6s ease-in-out infinite 3s;
    }
    .circuit-line {
      stroke-dasharray: 20 10;
      animation: scanLineFlow 18s linear infinite;
    }
    .pill-card-1 {
      animation: badgeFloat 4s ease-in-out infinite;
    }
    .pill-card-2 {
      animation: badgeFloatLag 4.5s ease-in-out infinite;
    }
    .pill-card-3 {
      animation: badgeFloat 5s ease-in-out infinite 1s;
    }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGradient)" rx="16" />

  <!-- Digital Tech Grid -->
  <rect width="1200" height="360" fill="url(#techGrid)" rx="16" />

  <!-- Animated Ambient Light Orbs (Background depth) -->
  <circle cx="200" cy="80" r="140" fill="url(#accentGlow)" class="orb-glow" />
  <circle cx="1020" cy="270" r="160" fill="url(#accentGlow)" class="orb-glow" style="animation-delay: -3s;" />
  <circle cx="600" cy="180" r="220" fill="#6366f1" fill-opacity="0.04" />

  <!-- Circuit Network Streams (Behind cards and text) -->
  <g opacity="0.35">
    <path class="circuit-line" d="M 0 100 Q 300 40 600 120 T 1200 80" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="circuit-line" d="M 0 280 Q 350 320 700 240 T 1200 260" fill="none" stroke="#818cf8" stroke-width="1.5" style="animation-duration: 24s;" />
  </g>

  <!-- Floating Dynamic Particle Accents -->
  <circle cx="280" cy="65" r="3" fill="#38bdf8" class="floating-dot-1" />
  <circle cx="940" cy="110" r="3.5" fill="#c084fc" class="floating-dot-2" />
  <circle cx="160" cy="290" r="2.5" fill="#34d399" class="floating-dot-3" />
  <circle cx="1060" cy="70" r="3" fill="#fbbf24" class="floating-dot-1" style="animation-delay: 2s;" />

  <!-- Decorative Toolchain Workflow Badges / Cards (Lower Layer / Side Anchors) -->
  <g class="pill-card-1" opacity="0.95">
    <rect x="80" y="240" width="220" height="48" rx="24" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" filter="url(#cardShadow)" />
    <circle cx="106" cy="264" r="10" fill="#38bdf8" fill-opacity="0.2" />
    <path d="M 102 264 L 105 267 L 111 261" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="124" y="269" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" letter-spacing="0.4">SAST &amp; Code Quality</text>
  </g>

  <g class="pill-card-2" opacity="0.95">
    <rect x="900" y="65" width="220" height="48" rx="24" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4" filter="url(#cardShadow)" />
    <circle cx="926" cy="89" r="10" fill="#c084fc" fill-opacity="0.2" />
    <path d="M 922 89 L 925 92 L 931 86" stroke="#c084fc" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="944" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" letter-spacing="0.4">Unified Rust Toolchains</text>
  </g>

  <g class="pill-card-3" opacity="0.95">
    <rect x="890" y="240" width="230" height="48" rx="24" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.4" filter="url(#cardShadow)" />
    <circle cx="916" cy="264" r="10" fill="#34d399" fill-opacity="0.2" />
    <path d="M 912 264 L 915 267 L 921 261" stroke="#34d399" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="934" y="269" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" letter-spacing="0.4">Automated CI/CD Gates</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, Highlights -->
  <!-- Category Tag -->
  <g transform="translate(600, 72)">
    <rect x="-130" y="-14" width="260" height="28" rx="14" fill="#1e1b4b" fill-opacity="0.8" stroke="#6366f1" stroke-width="1" />
    <text text-anchor="middle" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" letter-spacing="1.5">⚡ CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Foreground Title (Guaranteed Crisp & High-Contrast) -->
  <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#primaryGrad)" letter-spacing="-0.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.6))">
    Awesome Code Quality Toolchains
  </text>

  <!-- Foreground Subtitle -->
  <text x="600" y="185" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    High-Performance Linters • Static Code Analyzers • AppSec SAST &amp; CI/CD Gates
  </text>

  <!-- Central Spec Stats Pill Bar -->
  <g transform="translate(600, 240)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#111827" fill-opacity="0.9" stroke="#374151" stroke-width="1" />
    <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">
      <tspan fill="#38bdf8" font-weight="700">10 Top SaaS</tspan> Analyzers  •  
      <tspan fill="#818cf8" font-weight="700">30+ Open-Source</tspan> Toolchains  •  
      <tspan fill="#34d399" font-weight="700">Production</tspan> Ready
    </text>
  </g>

</svg>
